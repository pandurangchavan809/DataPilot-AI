<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52525b"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker>
    <style>
      .e{fill:none;stroke:#52525b;stroke-width:2;marker-end:url(#a)}
      .retry{fill:none;stroke:#d97706;stroke-width:2.5;stroke-dasharray:8 5;marker-end:url(#r)}
      .l{font-size:14px;fill:#3f3f46}
      .n{font-size:17px;font-weight:700;fill:#18181b;text-anchor:middle}
      .s{font-size:13px;fill:#52525b;text-anchor:middle}
      .agent{fill:#eef2ff;stroke:#6366f1;stroke-width:2.5}
      .reply{fill:#ffffff;stroke:#6366f1;stroke-width:2;stroke-dasharray:6 4}
      .code{fill:#ecfdf5;stroke:#059669;stroke-width:2}
      .fix{fill:#f4f4f5;stroke:#71717a;stroke-width:2}
      .pill{fill:#18181b}
      .pt{font-size:15px;font-weight:700;fill:#fff;text-anchor:middle}
    </style>
  </defs>
  <rect width="1120" height="520" fill="#fff"/>

  <!-- Retry loop -->
  <path class="retry" d="M950 90V55H700V88"/>
  <text x="825" y="44" font-size="14" font-weight="600" fill="#b45309" text-anchor="middle">error: fix the SQL and retry (max 3 attempts)</text>

  <!-- Arrows -->
  <path class="e" d="M135 125H173"/>
  <path class="e" d="M345 125H393"/>
  <text x="369" y="113" class="l" text-anchor="middle">data</text>
  <path class="e" d="M565 125H613"/>
  <path class="e" d="M785 125H863"/>
  <path class="e" d="M950 160V248"/>
  <text x="960" y="208" class="l">chart wanted</text>
  <path class="e" d="M865 285H787"/>
  <path class="e" d="M885 160L770 248"/>
  <text x="745" y="205" class="l" text-anchor="middle">no chart</text>
  <path class="e" d="M615 285H561"/>
  <path class="e" d="M260 160V248"/>
  <text x="270" y="208" class="l">general question</text>
  <path class="e" d="M345 285H403"/>
  <path class="e" d="M190 160H135V425H173"/>
  <text x="125" y="300" class="l" text-anchor="end">edit</text>
  <text x="125" y="318" class="l" text-anchor="end">request</text>
  <path class="e" d="M345 425H480V315"/>

  <!-- Nodes -->
  <rect x="25" y="97" width="110" height="56" rx="28" class="pill"/><text x="80" y="131" class="pt">Question</text>

  <rect x="175" y="90" width="170" height="70" rx="12" class="agent"/><text x="260" y="119" class="n">1. Router agent</text><text x="260" y="141" class="s">What is being asked?</text>
  <rect x="395" y="90" width="170" height="70" rx="12" class="agent"/><text x="480" y="119" class="n">2. Schema agent</text><text x="480" y="141" class="s">Which tables?</text>
  <rect x="615" y="90" width="170" height="70" rx="12" class="agent"/><text x="700" y="119" class="n">3. SQL agent</text><text x="700" y="141" class="s">Writes the SQL</text>
  <rect x="865" y="90" width="170" height="70" rx="12" class="code"/><text x="950" y="119" class="n">Guard + database</text><text x="950" y="141" class="s">Checks and runs it</text>

  <rect x="865" y="250" width="170" height="70" rx="12" class="agent"/><text x="950" y="279" class="n">4. Viz agent</text><text x="950" y="301" class="s">Designs the chart</text>
  <rect x="615" y="250" width="170" height="70" rx="12" class="agent"/><text x="700" y="279" class="n">5. Insight agent</text><text x="700" y="301" class="s">Explains the results</text>

  <rect x="405" y="257" width="150" height="56" rx="28" class="pill"/><text x="480" y="291" class="pt">Answer</text>

  <rect x="175" y="250" width="170" height="70" rx="12" class="reply"/><text x="260" y="279" class="n">Chat reply</text><text x="260" y="301" class="s">Simple LLM reply</text>
  <rect x="175" y="390" width="170" height="70" rx="12" class="fix"/><text x="260" y="419" class="n">Refusal</text><text x="260" y="441" class="s">Fixed text, no LLM</text>

  <!-- Legend -->
  <rect x="640" y="385" width="26" height="18" rx="4" class="agent"/><text x="678" y="399" class="l">Agent (5 in total)</text>
  <rect x="640" y="413" width="26" height="18" rx="4" class="reply"/><text x="678" y="427" class="l">Simple LLM step, not a separate agent</text>
  <rect x="640" y="441" width="26" height="18" rx="4" class="code"/><text x="678" y="455" class="l">Plain code, no AI</text>
  <rect x="640" y="469" width="26" height="18" rx="4" class="fix"/><text x="678" y="483" class="l">Fixed text, no AI</text>
</svg>
